<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResearchHive Location Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#111b2a;--text:#eef4ff;--muted:#9fb0c5;--accent:#ffbd59;--bdr:#2a4058;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;}
    header{padding:1rem 1.2rem;border-bottom:1px solid var(--bdr);background:#111827;}
    h1{margin:0;font-size:1.4rem;color:var(--accent);}
    p{margin:.35rem 0 0;color:var(--muted);}
    #map{height:64vh;min-height:420px;}
    .layout{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 78px);}
    aside{overflow:auto;border-left:1px solid var(--bdr);background:var(--panel);padding:1rem;}
    .card{display:block;color:var(--text);text-decoration:none;border:1px solid var(--bdr);border-radius:10px;padding:.75rem;margin:0 0 .75rem;background:#142132;}
    .card strong{color:var(--accent);}
    .card small{display:block;color:var(--muted);margin-top:.25rem;line-height:1.45;}
    .leaflet-popup-content{color:#102033;}
    @media(max-width:850px){.layout{display:block;}aside{border-left:0;border-top:1px solid var(--bdr);}#map{height:58vh;}}
  </style>
</head>
<body>
<header>
  <h1>Interactive Location Map</h1>
  <p>Source-grounded locations extracted from the report. Approximate/centroid points are labeled and should be verified before travel.</p>
</header>
<main class="layout">
  <section id="map" aria-label="Interactive report map"></section>
  <aside>
    <h2>Location Cards</h2>
    <div id="cards"></div>
  </aside>
</main>

s; book tours"},{"Country":"USA","Region":"Ohio Valley","Location":"**Mothman Museum**, Point Pleasant, WV","AddressOrArea":"400 Main St.","Phenomenon":"1966 Mothman sightings and archive culture","Category":"Cryptid","EvidenceLevel":0,"VisitPriority":0,"RouteCluster":"Appalachia / Ohio River","RouteStop":0,"OfficialUrl":"[Mothman Museum](https://www.mothmanmuseum.com/) [9]","Latitude":38.8443,"Longitude":-82.1371,"CoordinateConfidence":"Address-geocoded","AccessNotes":"Open public hours; separate folklore from proof"},{"Country":"USA","Region":"Southwest","Location":"**International UFO Museum**, Roswell, NM","AddressOrArea":"114 N. Main St.","Phenomenon":"1947 Roswell incident interpretation","Category":"UAP","EvidenceLevel":0,"VisitPriority":0,"RouteCluster":"Southwest UAP Loop","RouteStop":0,"OfficialUrl":"[Roswell UFO Museum](https://www.roswellufomuseum.com/) [11]","Latitude":33.3943,"Longitude":-104.523,"CoordinateConfidence":"Address-geocoded","AccessNotes":"Downtown museum; treat alien claims as contested"},{"Country":"USA","Region":"Four Corners","Location":"**Chaco Culture NHP**, NM","AddressOrArea":"Chaco Canyon, Nageezi area","Phenomenon":"Sacred landscape, archaeoastronomy, anomalous-landscape narratives","Category":"Sacred / anomalous landscape","EvidenceLevel":0,"VisitPriority":0,"RouteCluster":"Southwest Sacred Landscape","RouteStop":0,"OfficialUrl":"[NPS Chaco](https://www.nps.gov/chcu/planyourvisit/directions.htm)","Latitude":36.0606,"Longitude":-107.961,"CoordinateConfidence":"Regional park centroid","AccessNotes":"Dirt-road access; avoid unsafe/private routes; tribal-land respect required"},{"Country":"USA","Region":"Ohio River / Midwest","Location":"**Serpent Mound**, Peebles, OH","AddressOrArea":"3850 State Route 73","Phenomenon":"Effigy mound, sacred landscape, debated dating","Category":"Sacred / folklore","EvidenceLevel":0,"VisitPriority":0,"RouteCluster":"Great Lakes / Ohio Valley","RouteStop":0,"OfficialUrl":"[Ohio History](https://www.ohiohistory.org/visit/browse-historical-sites/serpent-mound/)","Latitude":39.0256,"Longitude":-83.4307,"CoordinateConfidence":"Address-geocoded","AccessNotes":"Limited hours; no trespass after gates close; drones prohibited"},{"Country":"Canada","Region":"Northwest Territories","Location":"**Nahanni National Park Reserve**","AddressOrArea":"South Nahanni River; Fort Simpson access office","Phenomenon":"Dene oral history, disappearance traditions, remote landscape lore","Category":"Folklore / anomalous landscape","EvidenceLevel":0,"VisitPriority":0,"RouteCluster":"Northern Canada","RouteStop":0,"OfficialUrl":"[Parks Canada](https://parks.canada.ca/pn-np/nt/nahanni/visit)","Latitude":61.5472,"Longitude":-125.5894,"CoordinateConfidence":"UNESCO property coordinate","AccessNotes":"No public roads; air or hike-in access; Indigenous co-management context"},{"Country":"Mexico","Region":"Central Mexico","Location":"**Teotihuacan**, Estado de M\u00E9xico","AddressOrArea":"Archaeological zone NE of Mexico City","Phenomenon":"Sacred city, symbolic geometry, later sacred-place traditions","Category":"Sacred / anomalous landscape","EvidenceLevel":0,"VisitPriority":0,"RouteCluster":"Central Mexico","RouteStop":0,"OfficialUrl":"[UNESCO](https://whc.unesco.org/en/list/414/)","Latitude":19.6917,"Longitude":-98.8417,"CoordinateConfidence":"UNESCO coordinate","AccessNotes":"Protected archaeological zone; use official paths and preservation rules"}];
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const bounds = [];
const colors = ['#7f8b99','#7cc7ff','#54d2a6','#ffbd59','#ff7a59','#f15b8a'];
const byRoute = new Map();
for (const row of rows) {
  const latlng = [row.Latitude, row.Longitude];
  bounds.push(latlng);
  const color = colors[Math.max(0, Math.min(5, Number(row.EvidenceLevel || 0)))];
  const marker = L.circleMarker(latlng, {radius: 7 + Math.min(9, Number(row.EvidenceLevel || 0) * 1.8), color:'#fff', weight:1, fillColor:color, fillOpacity:.86}).addTo(map);
  marker.bindPopup(`<strong>${esc(row.Location || row.Region || row.Country)}</strong><br>${esc(row.Phenomenon)}<br><small>${esc(row.AddressOrArea)}<br>Evidence ${esc(row.EvidenceLevel)} | ${esc(row.CoordinateConfidence)}</small>${row.OfficialUrl ? `<br><a href="${esc(row.OfficialUrl)}" target="_blank" rel="noopener noreferrer">Open source</a>` : ''}`);
  const route = row.RouteCluster || row.Region || 'Route';
  if (!byRoute.has(route)) byRoute.set(route, []);
  byRoute.get(route).push(row);
}
for (const [, items] of byRoute) {
  const ordered = items.slice().sort((a,b) => (a.RouteStop || 999) - (b.RouteStop || 999));
  if (ordered.length > 1) L.polyline(ordered.map(r => [r.Latitude, r.Longitude]), {color:'#ffbd59', opacity:.55, weight:3, dashArray:'8 8'}).addTo(map);
}
if (bounds.length) map.fitBounds(bounds, {padding:[32,32]}); else map.setView([42,-101], 4);
document.getElementById('cards').innerHTML = rows
  .slice()
  .sort((a,b) => (a.VisitPriority || 999) - (b.VisitPriority || 999))
  .map(row => `<a class="card" href="${esc(row.OfficialUrl || '#')}" target="_blank" rel="noopener noreferrer"><strong>${esc(row.Location || row.Region || row.Country)}</strong><small>${esc(row.Phenomenon)}<br>${esc(row.AddressOrArea)}<br>${esc(row.AccessNotes || 'Verify access before visiting.')}</small></a>`)
  .join('');
</script>
</body>
</html>
