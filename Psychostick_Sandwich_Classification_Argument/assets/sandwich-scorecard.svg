<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Sandwich-first scorecard</title>
  <desc id="desc">A cleaned scorecard comparing a song-only verdict with a sandwich-first verdict.</desc>
  <rect width="1600" height="980" rx="34" fill="#111722"/>
  <text x="108" y="126" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="900">Which verdict explains more?</text>
  <text x="108" y="178" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="28">The sandwich-first verdict wins because it preserves the premise.</text>

  <rect x="96" y="244" width="1408" height="612" rx="32" fill="#171d26" stroke="#30363d" stroke-width="2"/>
  <line x1="96" y1="356" x2="1504" y2="356" stroke="#30363d" stroke-width="2"/>
  <line x1="510" y1="244" x2="510" y2="856" stroke="#30363d" stroke-width="2"/>
  <line x1="940" y1="244" x2="940" y2="856" stroke="#30363d" stroke-width="2"/>
  <line x1="96" y1="476" x2="1504" y2="476" stroke="#30363d" stroke-width="2"/>
  <line x1="96" y1="596" x2="1504" y2="596" stroke="#30363d" stroke-width="2"/>
  <line x1="96" y1="716" x2="1504" y2="716" stroke="#30363d" stroke-width="2"/>

  <text x="138" y="320" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Criterion</text>
  <text x="560" y="320" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Song-only</text>
  <rect x="972" y="274" width="420" height="58" rx="18" fill="#f6ecd2"/>
  <text x="1010" y="314" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">Sandwich-first</text>

  <text x="138" y="430" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Title</text>
  <text x="560" y="412" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="560" dy="0">makes the title</tspan>
    <tspan x="560" dy="30">look decorative</tspan>
  </text>
  <text x="980" y="412" fill="#f6ecd2" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="980" dy="0">treats the title</tspan>
    <tspan x="980" dy="30">as the verdict</tspan>
  </text>

  <text x="138" y="550" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Album world</text>
  <text x="560" y="532" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="560" dy="0">food theme</tspan>
    <tspan x="560" dy="30">fades back</tspan>
  </text>
  <text x="980" y="532" fill="#f6ecd2" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="980" dy="0">food world</tspan>
    <tspan x="980" dy="30">sets the rules</tspan>
  </text>

  <text x="138" y="670" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Metadata</text>
  <text x="560" y="652" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="560" dy="0">lets shelving</tspan>
    <tspan x="560" dy="30">call the thing</tspan>
  </text>
  <text x="980" y="652" fill="#f6ecd2" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="980" dy="0">keeps metadata</tspan>
    <tspan x="980" dy="30">to delivery</tspan>
  </text>

  <text x="138" y="790" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Joke point</text>
  <text x="560" y="772" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="560" dy="0">centers the shell</tspan>
    <tspan x="560" dy="30">misses the premise</tspan>
  </text>
  <text x="980" y="772" fill="#f6ecd2" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="980" dy="0">centers the premise</tspan>
    <tspan x="980" dy="30">uses the shell</tspan>
  </text>

  <rect x="512" y="886" width="580" height="74" rx="24" fill="#f7c85d"/>
  <text x="570" y="932" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">Decision: sandwich explains more.</text>
</svg>