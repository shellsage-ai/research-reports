<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How the joke works</title>
  <desc id="desc">A four step flow showing how the song establishes and sustains the sandwich joke.</desc>
  <rect width="1600" height="900" fill="#0e1117"/>
  <text x="110" y="120" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Why the joke lands</text>
  <text x="110" y="176" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28">The humor comes from treating an obvious song as though it should count as lunch.</text>

  <g>
    <rect x="110" y="280" width="300" height="300" rx="28" fill="#161b22" stroke="#30363d"/>
    <circle cx="180" cy="350" r="38" fill="#ff9800"/>
    <text x="165" y="362" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">1</text>
    <text x="150" y="432" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Recognition</text>
    <text x="150" y="485" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">The listener hears</text>
    <text x="150" y="518" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">a structured metal track.</text>
  </g>

  <g>
    <rect x="450" y="280" width="300" height="300" rx="28" fill="#161b22" stroke="#30363d"/>
    <circle cx="520" cy="350" r="38" fill="#58a6ff"/>
    <text x="505" y="362" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">2</text>
    <text x="490" y="432" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Denial</text>
    <text x="490" y="485" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">The title and lyrics insist</text>
    <text x="490" y="518" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">that it is not a song.</text>
  </g>

  <g>
    <rect x="790" y="280" width="300" height="300" rx="28" fill="#161b22" stroke="#30363d"/>
    <circle cx="860" cy="350" r="38" fill="#ffd166"/>
    <text x="845" y="362" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">3</text>
    <text x="830" y="432" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Commitment</text>
    <text x="830" y="485" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">The band doubles down</text>
    <text x="830" y="518" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">instead of resolving the gap.</text>
  </g>

  <g>
    <rect x="1130" y="280" width="300" height="300" rx="28" fill="#161b22" stroke="#30363d"/>
    <circle cx="1200" cy="350" r="38" fill="#ff9800"/>
    <text x="1185" y="362" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">4</text>
    <text x="1170" y="432" fill="#ff9800" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Payoff</text>
    <text x="1170" y="485" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">The contradiction itself</text>
    <text x="1170" y="518" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">becomes the entertainment.</text>
  </g>

  <path d="M410 430 C430 430 440 430 450 430" stroke="#30363d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M750 430 C770 430 780 430 790 430" stroke="#30363d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M1090 430 C1110 430 1120 430 1130 430" stroke="#30363d" stroke-width="8" stroke-linecap="round" fill="none"/>

  <rect x="250" y="690" width="1100" height="88" rx="22" fill="#111722" stroke="#ff9800" stroke-width="2"/>
  <text x="312" y="744" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">The humor only works because the listener can tell the object is a real song while hearing it deny that fact.</text>
</svg>