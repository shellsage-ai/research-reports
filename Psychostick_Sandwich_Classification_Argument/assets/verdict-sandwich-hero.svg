<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Sandwich-first verdict poster</title>
  <desc id="desc">A cleaned hero graphic arguing that song explains delivery while sandwich explains identity.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8edd2"/>
      <stop offset="100%" stop-color="#f1c763"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="980" rx="34" fill="#0f1520"/>
  <rect x="32" y="32" width="1536" height="916" rx="34" fill="url(#hero-bg)"/>

  <text x="104" y="126" fill="#935d00" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4">PSYCHOSTICK CLASSIFICATION ARGUMENT</text>
  <text x="104" y="232" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="900">Force the verdict</text>
  <text x="104" y="320" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="900">toward sandwich.</text>
  <text x="104" y="404" fill="#2b3542" font-family="Segoe UI, Arial, sans-serif" font-size="30">
    <tspan x="104" dy="0">Song explains delivery.</tspan>
    <tspan x="104" dy="38">Sandwich explains identity.</tspan>
  </text>

  <rect x="104" y="520" width="492" height="128" rx="24" fill="#161c25"/>
  <text x="146" y="572" fill="#f7c85d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">DELIVERY FORMAT</text>
  <text x="146" y="630" fill="#f6f1e7" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="900">Song / track</text>

  <rect x="104" y="678" width="492" height="172" rx="24" fill="#fff8ea" stroke="#161c25" stroke-width="3"/>
  <text x="146" y="732" fill="#935d00" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">GOVERNING IDENTITY</text>
  <text x="146" y="796" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="900">Sandwich</text>
  <text x="146" y="838" fill="#2b3542" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="146" dy="0">Title, album, and premise</tspan>
    <tspan x="146" dy="30">all push here.</tspan>
  </text>

  <g transform="translate(930 152)">
    <ellipse cx="222" cy="560" rx="236" ry="52" fill="#c7aa68" opacity="0.26"/>
    <path d="M86 136 C118 82 164 52 224 52 C286 52 330 82 362 136" fill="none" stroke="#161c25" stroke-width="10" stroke-linecap="round"/>
    <rect x="80" y="146" width="288" height="70" rx="35" fill="#d4963f"/>
    <rect x="62" y="218" width="324" height="30" rx="15" fill="#5f9e5b"/>
    <rect x="68" y="256" width="312" height="34" rx="17" fill="#f3d55d"/>
    <rect x="56" y="302" width="336" height="24" rx="12" fill="#b54a3e"/>
    <rect x="50" y="340" width="348" height="28" rx="14" fill="#ffd889"/>
    <rect x="66" y="382" width="316" height="42" rx="21" fill="#7d5327"/>
    <rect x="74" y="426" width="300" height="58" rx="29" fill="#d5a24f"/>
    <text x="132" y="548" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="900">SANDWICH</text>
    <text x="104" y="590" fill="#2b3542" font-family="Segoe UI, Arial, sans-serif" font-size="23">
      <tspan x="104" dy="0">Wrapper outside.</tspan>
      <tspan x="104" dy="28">Filling inside.</tspan>
    </text>
  </g>

  <path d="M618 586 C706 586 744 586 826 586" fill="none" stroke="#161c25" stroke-width="8" stroke-linecap="round"/>
  <circle cx="678" cy="586" r="10" fill="#161c25"/>
  <circle cx="742" cy="586" r="10" fill="#161c25"/>
  <circle cx="806" cy="586" r="10" fill="#161c25"/>

  <rect x="998" y="700" width="420" height="154" rx="24" fill="#161c25"/>
  <text x="1038" y="766" fill="#f7c85d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">REPORT POSITION</text>
  <text x="1038" y="824" fill="#f6f1e7" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">Sandwich first.</text>
  <text x="1038" y="850" fill="#d6deea" font-family="Segoe UI, Arial, sans-serif" font-size="23">Song is the wrapper.</text>
</svg>