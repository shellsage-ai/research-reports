<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence hierarchy for the report</title>
  <desc id="desc">A stacked source hierarchy showing official sources, catalog sources, reference definitions, and press context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="110" y="120" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Evidence hierarchy used for the final synthesis</text>
  <text x="110" y="176" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28">The report weights sources by how directly they answer the classification question.</text>

  <rect x="110" y="250" width="1380" height="120" rx="26" fill="#ffb74d" opacity="0.95"/>
  <text x="160" y="315" fill="#111722" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">1. Official Psychostick sources</text>
  <text x="160" y="355" fill="#111722" font-family="Segoe UI, Arial, sans-serif" font-size="24">Lyrics page, music page, and about page carry the most weight for intent, credits, and framing.</text>

  <rect x="170" y="400" width="1260" height="110" rx="24" fill="#ff9800" opacity="0.88"/>
  <text x="215" y="460" fill="#111722" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">2. Catalog and storefront metadata</text>
  <text x="215" y="497" fill="#111722" font-family="Segoe UI, Arial, sans-serif" font-size="22">Bandcamp, the official store, and Apple Music confirm runtime, track placement, and release behavior.</text>

  <rect x="230" y="540" width="1140" height="100" rx="22" fill="#58a6ff" opacity="0.82"/>
  <text x="270" y="596" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">3. Reference definitions</text>
  <text x="270" y="628" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="21">Dictionary and encyclopedia definitions clarify what counts as a song and what counts as a sandwich.</text>

  <rect x="290" y="670" width="1020" height="86" rx="20" fill="#30363d" opacity="0.96"/>
  <text x="326" y="723" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">4. Press context</text>
  <text x="520" y="723" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Useful for album-era framing, but not strong enough to override the direct release record.</text>

  <path d="M1330 300 L1415 450 L1330 600" fill="none" stroke="#ffd166" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1365" y="470" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Highest directness</text>
</svg>