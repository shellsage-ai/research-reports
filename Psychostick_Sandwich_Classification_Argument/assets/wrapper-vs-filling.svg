<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Wrapper versus filling</title>
  <desc id="desc">A cleaned figure showing that release facts prove the wrapper while title and premise name the filling.</desc>
  <rect width="1600" height="980" rx="34" fill="#111722"/>
  <text x="108" y="126" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="900">What release facts actually prove</text>
  <text x="108" y="178" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="28">They prove the wrapper: audio delivery, credits, runtime, and shelf placement.</text>

  <rect x="118" y="286" width="294" height="124" rx="24" fill="#161b22" stroke="#30363d"/>
  <text x="152" y="342" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">Lyrics page</text>
  <text x="152" y="380" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="22">credits and track slot</text>

  <rect x="118" y="438" width="294" height="124" rx="24" fill="#161b22" stroke="#30363d"/>
  <text x="152" y="494" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">Bandcamp</text>
  <text x="152" y="532" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="22">runtime and album slot</text>

  <rect x="118" y="590" width="294" height="124" rx="24" fill="#161b22" stroke="#30363d"/>
  <text x="152" y="646" fill="#ffb74d" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">Store + Apple Music</text>
  <text x="152" y="684" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="22">sales and streaming bins</text>

  <path d="M446 500 C528 500 570 500 642 500" fill="none" stroke="#f7c85d" stroke-width="10" stroke-linecap="round"/>
  <circle cx="490" cy="500" r="11" fill="#f7c85d"/>
  <circle cx="556" cy="500" r="11" fill="#f7c85d"/>
  <circle cx="622" cy="500" r="11" fill="#f7c85d"/>

  <rect x="672" y="320" width="326" height="388" rx="34" fill="#f6ecd2"/>
  <path d="M756 408 C780 364 816 342 862 342 C908 342 944 364 968 408" fill="none" stroke="#161c25" stroke-width="9" stroke-linecap="round"/>
  <rect x="742" y="416" width="240" height="50" rx="25" fill="#d39a46"/>
  <rect x="728" y="470" width="268" height="22" rx="11" fill="#5b9b59"/>
  <rect x="734" y="500" width="256" height="24" rx="12" fill="#f2d15f"/>
  <rect x="724" y="534" width="276" height="18" rx="9" fill="#b54a3e"/>
  <rect x="718" y="564" width="288" height="24" rx="12" fill="#ffd889"/>
  <rect x="736" y="598" width="252" height="38" rx="19" fill="#7d5327"/>
  <text x="829" y="654" text-anchor="middle" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">WRAPPER FACTS</text>
  <text x="829" y="688" text-anchor="middle" fill="#3a4655" font-family="Segoe UI, Arial, sans-serif" font-size="20">prove a music shell</text>

  <rect x="1040" y="290" width="430" height="432" rx="32" fill="#171d26" stroke="#30363d" stroke-width="2"/>
  <text x="1086" y="352" fill="#f7c85d" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">WHAT THEY DO NOT NAME</text>
  <text x="1086" y="424" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="900">The filling.</text>
  <text x="1086" y="490" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="24">
    <tspan x="1086" dy="0">Use title, album,</tspan>
    <tspan x="1086" dy="32">and premise to name it.</tspan>
  </text>
  <rect x="1072" y="596" width="330" height="64" rx="22" fill="#58a6ff"/>
  <text x="1120" y="638" fill="#0d1117" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="900">Wrapper != filling</text>
</svg>