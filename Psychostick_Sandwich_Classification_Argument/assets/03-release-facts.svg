<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Release facts supporting song classification</title>
  <desc id="desc">A card-based chart summarizing the release facts that support classifying the work as a song or track.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <text x="110" y="120" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Release facts that lock in the literal answer</text>
  <text x="110" y="176" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28">Every direct release system treats the work as a track rather than an edible object.</text>

  <g>
    <rect x="110" y="255" width="300" height="245" rx="24" fill="#161b22" stroke="#30363d"/>
    <text x="145" y="320" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Official lyrics</text>
    <text x="145" y="380" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">Credits</text>
    <text x="145" y="425" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Music to Key</text>
    <text x="145" y="456" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Lyrics to Key and Grant</text>
  </g>

  <g>
    <rect x="450" y="255" width="300" height="245" rx="24" fill="#161b22" stroke="#30363d"/>
    <text x="485" y="320" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Bandcamp</text>
    <text x="485" y="380" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">3:53</text>
    <text x="485" y="425" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Runtime listed as a</text>
    <text x="485" y="456" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">track on Sandwich</text>
  </g>

  <g>
    <rect x="790" y="255" width="300" height="245" rx="24" fill="#161b22" stroke="#30363d"/>
    <text x="825" y="320" fill="#ff9800" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Official store</text>
    <text x="825" y="380" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">Track list</text>
    <text x="825" y="425" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Sold inside a CD and</text>
    <text x="825" y="456" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">digital album product</text>
  </g>

  <g>
    <rect x="1130" y="255" width="300" height="245" rx="24" fill="#161b22" stroke="#30363d"/>
    <text x="1165" y="320" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Apple Music</text>
    <text x="1165" y="380" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">Platform song</text>
    <text x="1165" y="425" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Presented in the same</text>
    <text x="1165" y="456" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="22">structure as any other track</text>
  </g>

  <path d="M215 585 H1325" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="260" cy="585" r="18" fill="#ffb74d"/>
  <circle cx="600" cy="585" r="18" fill="#58a6ff"/>
  <circle cx="940" cy="585" r="18" fill="#ff9800"/>
  <circle cx="1280" cy="585" r="18" fill="#ffd166"/>
  <text x="110" y="705" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Shared implication</text>
  <text x="110" y="760" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28">Different systems converge on the same thing: the object lives in music infrastructure and behaves like a song.</text>
</svg>