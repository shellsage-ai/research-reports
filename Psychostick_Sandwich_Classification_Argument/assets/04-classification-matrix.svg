<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Literal versus comedic classification matrix</title>
  <desc id="desc">A side by side matrix comparing the song frame and the sandwich frame across criteria.</desc>
  <rect width="1600" height="900" fill="#0e1117"/>
  <text x="110" y="120" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">Two classification frames, two different jobs</text>
  <text x="110" y="175" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28">The literal frame answers what the object is in distribution. The sandwich frame answers how the joke works.</text>

  <rect x="110" y="240" width="1380" height="520" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <line x1="520" y1="240" x2="520" y2="760" stroke="#30363d" stroke-width="2"/>
  <line x1="1010" y1="240" x2="1010" y2="760" stroke="#30363d" stroke-width="2"/>
  <line x1="110" y1="340" x2="1490" y2="340" stroke="#30363d" stroke-width="2"/>
  <line x1="110" y1="440" x2="1490" y2="440" stroke="#30363d" stroke-width="2"/>
  <line x1="110" y1="540" x2="1490" y2="540" stroke="#30363d" stroke-width="2"/>
  <line x1="110" y1="640" x2="1490" y2="640" stroke="#30363d" stroke-width="2"/>

  <text x="160" y="302" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Criterion</text>
  <text x="570" y="302" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Literal song / track frame</text>
  <text x="1060" y="302" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Comedic sandwich frame</text>

  <text x="160" y="398" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Primary question</text>
  <text x="570" y="398" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">What is it in catalogs and music systems?</text>
  <text x="1060" y="398" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">What identity does the bit insist on?</text>

  <text x="160" y="498" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Best evidence</text>
  <text x="570" y="498" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">Credits, runtime, placement, streaming, store metadata</text>
  <text x="1060" y="498" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">Title, lyric framing, album concept, house style</text>

  <text x="160" y="598" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Strength</text>
  <text x="570" y="598" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">High confidence and directly descriptive</text>
  <text x="1060" y="598" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">High comedic importance but not literal food proof</text>

  <text x="160" y="698" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Output</text>
  <text x="570" y="698" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">A comedy-metal song or track</text>
  <text x="1060" y="698" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24">A sandwich thesis that powers the joke</text>

  <rect x="435" y="790" width="730" height="62" rx="31" fill="#ff9800"/>
  <text x="495" y="831" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Final synthesis: keep both layers, but let the song frame control the literal verdict.</text>
</svg>