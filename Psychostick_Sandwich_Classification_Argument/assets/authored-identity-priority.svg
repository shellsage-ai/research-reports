<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Authored identity outranks catalog metadata</title>
  <desc id="desc">A cleaned comparison graphic showing why identity evidence should outrank catalog shelving.</desc>
  <rect width="1600" height="980" rx="34" fill="#111722"/>
  <text x="108" y="126" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="900">What should outrank what?</text>
  <text x="108" y="178" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="28">For this report, identity evidence should outrun filing evidence.</text>

  <rect x="108" y="236" width="760" height="580" rx="32" fill="#f6ecd2"/>
  <text x="154" y="304" fill="#935d00" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">PRIMARY EVIDENCE</text>
  <text x="154" y="374" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="900">Authored sandwich identity</text>

  <rect x="154" y="426" width="664" height="96" rx="22" fill="#161c25"/>
  <text x="190" y="468" fill="#f7c85d" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">1. Title says sandwich.</text>
  <text x="190" y="506" fill="#f5efe4" font-family="Segoe UI, Arial, sans-serif" font-size="22">That is the claim, not the garnish.</text>

  <rect x="154" y="550" width="664" height="96" rx="22" fill="#fff4da" stroke="#e6c07b" stroke-width="2"/>
  <text x="190" y="592" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">2. Album stays food-first.</text>
  <text x="190" y="630" fill="#3a4655" font-family="Segoe UI, Arial, sans-serif" font-size="22">The surrounding tracks keep the joke coherent.</text>

  <rect x="154" y="674" width="664" height="96" rx="22" fill="#fff4da" stroke="#e6c07b" stroke-width="2"/>
  <text x="190" y="716" fill="#161c25" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">3. The band doubles down.</text>
  <text x="190" y="754" fill="#3a4655" font-family="Segoe UI, Arial, sans-serif" font-size="22">Overcommitment is the mechanism, not a rebuttal.</text>

  <rect x="940" y="272" width="544" height="420" rx="30" fill="#171d26" stroke="#30363d" stroke-width="2"/>
  <text x="986" y="334" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="3">SECONDARY EVIDENCE</text>
  <text x="986" y="406" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="900">Catalog metadata</text>
  <text x="986" y="468" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Useful for filing audio:</text>
  <text x="1014" y="522" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="24">
    <tspan x="1014" dy="0">- runtime</tspan>
    <tspan x="1014" dy="40">- credits</tspan>
    <tspan x="1014" dy="40">- store slot</tspan>
  </text>
  <text x="986" y="670" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="986" dy="0">Good for shelving.</tspan>
    <tspan x="986" dy="30">Weak for naming the thing.</tspan>
  </text>

  <path d="M864 490 C896 490 912 490 940 490" fill="none" stroke="#f7c85d" stroke-width="9" stroke-linecap="round"/>
  <polygon points="940,490 916,476 916,504" fill="#f7c85d"/>
  <rect x="770" y="446" width="126" height="46" rx="18" fill="#f7c85d"/>
  <text x="790" y="475" fill="#151b23" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">SUPPORTS</text>

  <rect x="940" y="730" width="470" height="100" rx="24" fill="#58a6ff"/>
  <text x="980" y="778" fill="#0d1117" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">DECISION RULE</text>
  <text x="980" y="820" fill="#0d1117" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="900">Identity beats shelving.</text>
</svg>