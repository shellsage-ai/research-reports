<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Authored identity outranks catalog metadata</title>
  <desc id="desc">A comparison graphic showing why title, lyrics, album concept, and band persona should outweigh store metadata when deciding the report verdict.</desc>
  <rect width="1600" height="980" rx="34" fill="#111722"/>
  <text x="108" y="126" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="900">What should outrank what?</text>
  <text x="108" y="180" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="29">For this report, authored identity evidence should outrun filing evidence.</text>

  <rect x="108" y="250" width="760" height="548" rx="30" fill="#f6ecd2"/>
  <text x="158" y="320" fill="#915c00" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="3">PRIMARY EVIDENCE</text>
  <text x="158" y="390" fill="#151b23" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="900">Authored sandwich identity</text>
  <rect x="158" y="440" width="660" height="78" rx="20" fill="#151b23"/>
  <text x="190" y="489" fill="#f7c85d" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">1. Title says it outright</text>
  <text x="190" y="562" fill="#2b3542" font-family="Segoe UI, Arial, sans-serif" font-size="27">"This Is Not a Song, It's a Sandwich" is not a hint. It is a direct category claim.</text>
  <rect x="158" y="610" width="660" height="62" rx="18" fill="#ffd889"/>
  <text x="190" y="651" fill="#151b23" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800">2. Album world reinforces it: Sandwich, food tracks, appetite framing.</text>
  <rect x="158" y="700" width="660" height="62" rx="18" fill="#ffd889"/>
  <text x="190" y="741" fill="#151b23" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800">3. Comedy-metal overcommitment is the mechanism, not a rebuttal.</text>

  <rect x="954" y="320" width="530" height="360" rx="28" fill="#171d26" stroke="#30363d" stroke-width="2"/>
  <text x="1000" y="385" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">SECONDARY EVIDENCE</text>
  <text x="1000" y="452" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="900">Catalog metadata</text>
  <text x="1000" y="515" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="26">Useful for telling us where the audio lives:</text>
  <text x="1000" y="566" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="24">- runtime</text>
  <text x="1000" y="606" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="24">- credits</text>
  <text x="1000" y="646" fill="#dbe4ee" font-family="Segoe UI, Arial, sans-serif" font-size="24">- platform placement</text>
  <text x="1000" y="708" fill="#aab5c0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Not enough on its own to overrule the work's chosen identity.</text>

  <path d="M892 500 C936 500 946 500 954 500" fill="none" stroke="#f7c85d" stroke-width="9" stroke-linecap="round"/>
  <polygon points="955,500 930,486 930,514" fill="#f7c85d"/>
  <text x="900" y="455" fill="#f7c85d" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">should not control verdict</text>

  <rect x="954" y="744" width="530" height="108" rx="24" fill="#58a6ff"/>
  <text x="998" y="794" fill="#0d1117" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">DECISION RULE</text>
  <text x="998" y="836" fill="#0d1117" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="900">Identity evidence beats shelf evidence.</text>
</svg>