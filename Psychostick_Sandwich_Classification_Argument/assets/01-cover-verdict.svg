<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Psychostick sandwich classification cover visual</title>
  <desc id="desc">A cover graphic showing the literal song classification, the sandwich joke frame, and the combined final verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="190" cy="120" r="150" fill="#ff9800" opacity="0.12"/>
  <circle cx="1410" cy="790" r="190" fill="#58a6ff" opacity="0.10"/>
  <text x="110" y="130" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="4">RESEARCHHIVE REPORT VISUAL</text>
  <text x="110" y="220" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">Psychostick: song in the catalog,</text>
  <text x="110" y="292" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">sandwich in the joke.</text>
  <text x="110" y="355" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="30">The strongest reading keeps both layers visible instead of forcing one to erase the other.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="430" width="420" height="250" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="150" y="490" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Literal classification</text>
    <text x="150" y="565" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">Song / Track</text>
    <text x="150" y="620" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="24">Published, listed, credited, and streamed</text>
    <text x="150" y="654" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="24">inside ordinary music systems.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="585" y="430" width="420" height="250" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="625" y="490" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Comedic frame</text>
    <text x="625" y="565" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">Sandwich</text>
    <text x="625" y="620" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="24">The title and lyrics push a deliberate</text>
    <text x="625" y="654" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="24">category mistake as the punchline.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="390" width="430" height="330" rx="32" fill="url(#accent)"/>
    <text x="1105" y="470" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Best-fit verdict</text>
    <text x="1105" y="550" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="900">Comedy-metal</text>
    <text x="1105" y="612" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="900">song with a</text>
    <text x="1105" y="674" fill="#0b0f16" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="900">sandwich thesis</text>
  </g>

  <path d="M1005 555 C1045 555 1068 555 1100 555" stroke="#ff9800" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="1025" cy="555" r="10" fill="#ff9800"/>
  <circle cx="1076" cy="555" r="10" fill="#ff9800"/>
</svg>